[project]
name = "lembrai"
version = "0.1.0"
description = "A personal assistant that knows your stuff and acts on your behalf"
requires-python = ">=3.12"
dependencies = [
    "groq>=0.13",
    "python-dotenv>=1.0",
    "chromadb>=1.5",
    "sentence-transformers>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
api = [
    "fastapi",
    "uvicorn[standard]",
]

[project.scripts]
lembrai = "lembrai.cli:main"
lembrai-check = "lembrai.check:main"
lembrai-api = "lembrai.api:main"
lembrai-eval = "lembrai.evals:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
