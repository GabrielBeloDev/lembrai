[project]
name = "lembrai"
version = "0.1.0"
description = "A personal assistant that knows your stuff and acts on your behalf"
requires-python = ">=3.12"
dependencies = [
    "groq>=0.13",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
lembrai = "lembrai.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
